name: Build and Release Monorepo Tarballs

on:
  push:
    branches:
      - dwq-918-fix-filter-date-range-null-dates

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Step 1: Install dependencies cleanly using original workspace names
      - name: Install Monorepo Dependencies
        run: npm install --no-audit --no-fund

      # Step 2: Inject the dynamic fork version suffix into the workspaces
      - name: Inject Fork Version Overrides
        id: version_env
        run: |
          ORIGINAL_VERSION=$(jq -r '.version' ./package.json)
          FORK_VERSION="${ORIGINAL_VERSION}-fork.1"
          echo "computed_version=$FORK_VERSION" >> $GITHUB_OUTPUT

          jq --arg ver "$FORK_VERSION" '.version = $ver' ./@utahdts/utah-design-system/package.json > temp1.json && mv temp1.json ./@utahdts/utah-design-system/package.json
          jq --arg ver "$FORK_VERSION" '.version = $ver' ./@utahdts/utah-design-system-header/package.json > temp2.json && mv temp2.json ./@utahdts/utah-design-system-header/package.json

      # Step 3: Compile workspaces using native, unaltered scripts
      - name: Compile Workspace Libraries
        run: npm run buildForNPM

      # Step 4: Pack workspaces and dynamically transform their scopes from @utahdts to @utahdeq
      - name: Pack and Convert Scope to @utahdeq
        id: pack_step
        run: |
          # 1. Generate the initial tarballs
          npm pack --workspaces

          # Exact filenames based on npm's packing output patterns
          ORIGINAL_CORE="utahdts-utah-design-system-${{ steps.version_env.outputs.computed_version }}.tgz"
          ORIGINAL_HEADER="utahdts-utah-design-system-header-${{ steps.version_env.outputs.computed_version }}.tgz"

          # 2. Convert the Core Library package identity
          mkdir -p ./core-unpack && tar -xzf "$ORIGINAL_CORE" -C ./core-unpack
          jq '.name = "@utahdeq/utah-design-system"' ./core-unpack/package/package.json > temp_core.json && mv temp_core.json ./core-unpack/package/package.json
          cd ./core-unpack/package && npm pack && mv utahdeq-utah-design-system-*.tgz $GITHUB_WORKSPACE/ && cd $GITHUB_WORKSPACE

          # 3. Convert the Header Component package identity and link it to the new core scope
          mkdir -p ./header-unpack && tar -xzf "$ORIGINAL_HEADER" -C ./header-unpack
          jq '.name = "@utahdeq/utah-design-system-header" | .dependencies["@utahdeq/utah-design-system"] = .dependencies["@utahdts/utah-design-system"] | del(.dependencies["@utahdts/utah-design-system"])' ./header-unpack/package/package.json > temp_header.json && mv temp_header.json ./header-unpack/package/package.json
          cd ./header-unpack/package && npm pack && mv utahdeq-utah-design-system-header-*.tgz $GITHUB_WORKSPACE/ && cd $GITHUB_WORKSPACE

          # 4. Pass the modified paths forward to the release upload engine
          FINAL_CORE=$(ls utahdeq-utah-design-system-*.tgz)
          FINAL_HEADER=$(ls utahdeq-utah-design-system-header-*.tgz)

          echo "core_path=$GITHUB_WORKSPACE/$FINAL_CORE" >> $GITHUB_OUTPUT
          echo "header_path=$GITHUB_WORKSPACE/$FINAL_HEADER" >> $GITHUB_OUTPUT

      # Step 5: Upload both generated @utahdeq tarball assets to the single GitHub Release
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version_env.outputs.computed_version }}"
          name: "Release v${{ steps.version_env.outputs.computed_version }} (DWQ Date Range Patch)"
          draft: false
          prerelease: false
          files: |
            ${{ steps.pack_step.outputs.core_path }}
            ${{ steps.pack_step.outputs.header_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
