name: Build and Release Monorepo Tarballs

on:
  push:
    branches:
      - dwq-918-fix-filter-date-range-null-dates

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Step 1: Install dependencies using the pristine upstream structure
      - name: Install Monorepo Dependencies
        run: npm install --no-audit --no-fund

      # Step 2: Dynamically append the fork suffix (-fork.1) to internal workspace versions
      - name: Inject Fork Version Overrides
        id: version_env
        run: |
          ORIGINAL_VERSION=$(jq -r '.version' ./package.json)
          FORK_VERSION="${ORIGINAL_VERSION}-fork.1"
          echo "computed_version=$FORK_VERSION" >> $GITHUB_OUTPUT

          jq --arg ver "$FORK_VERSION" '.version = $ver' ./@utahdts/utah-design-system/package.json > temp1.json && mv temp1.json ./@utahdts/utah-design-system/package.json
          jq --arg ver "$FORK_VERSION" '.version = $ver' ./@utahdts/utah-design-system-header/package.json > temp2.json && mv temp2.json ./@utahdts/utah-design-system-header/package.json

      # Step 3: Compile workspaces using native, unaltered monorepo pipelines
      - name: Compile Workspace Libraries
        run: npm run buildForNPM

      # Step 4: Pack the unaltered workspaces, then convert identities directly in memory
      - name: Pack and Convert Scope to @utahdeq
        id: pack_step
        run: |
          # 1. Use the workspace engine to drop the original .tgz files in the root folder
          npm pack --workspaces

          VERSION_TAG="${{ steps.version_env.outputs.computed_version }}"
          ORIGINAL_CORE="utahdts-utah-design-system-${VERSION_TAG}.tgz"
          ORIGINAL_HEADER="utahdts-utah-design-system-header-${VERSION_TAG}.tgz"

          # 2. Extract and transform the Core Library scope boundary
          mkdir -p ./core-unpack && tar -xzf "$ORIGINAL_CORE" -C ./core-unpack
          jq '.name = "@utahdeq/utah-design-system"' ./core-unpack/package/package.json > temp_core.json && mv temp_core.json ./core-unpack/package/package.json

          # Repack without using npm pack commands to eliminate dependencies scanning
          cd ./core-unpack && tar -czf "$GITHUB_WORKSPACE/utahdeq-utah-design-system-${VERSION_TAG}.tgz" package && cd $GITHUB_WORKSPACE

          # 3. Extract and transform the Header Component scope boundary and internal link
          mkdir -p ./header-unpack && tar -xzf "$ORIGINAL_HEADER" -C ./header-unpack
          jq '.name = "@utahdeq/utah-design-system-header" | .dependencies["@utahdeq/utah-design-system"] = .dependencies["@utahdts/utah-design-system"] | del(.dependencies["@utahdts/utah-design-system"])' ./header-unpack/package/package.json > temp_header.json && mv temp_header.json ./header-unpack/package/package.json

          # Repack without using npm pack commands to eliminate dependencies scanning
          cd ./header-unpack && tar -czf "$GITHUB_WORKSPACE/utahdeq-utah-design-system-header-${VERSION_TAG}.tgz" package && cd $GITHUB_WORKSPACE

          # 4. Map the newly generated pristine archive targets
          echo "core_path=$GITHUB_WORKSPACE/utahdeq-utah-design-system-${VERSION_TAG}.tgz" >> $GITHUB_OUTPUT
          echo "header_path=$GITHUB_WORKSPACE/utahdeq-utah-design-system-header-${VERSION_TAG}.tgz" >> $GITHUB_OUTPUT

      # Step 5: Securely upload both converted tarball assets to the single GitHub Release
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version_env.outputs.computed_version }}"
          name: "Release v${{ steps.version_env.outputs.computed_version }} (DWQ Date Range Patch)"
          draft: false
          prerelease: false
          files: |
            ${{ steps.pack_step.outputs.core_path }}
            ${{ steps.pack_step.outputs.header_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
