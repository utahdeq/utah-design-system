name: Build and Release Monorepo Tarballs

on:
  push:
    branches:
      - ddw-1811

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Step 1: Install dependencies using the pristine upstream structure
      - name: Install Monorepo Dependencies
        run: npm install --no-audit --no-fund

      # Step 2: Dynamically append the fork suffix (-fork.3) to internal workspace versions
      - name: Inject Fork Version Overrides
        id: version_env
        run: |
          ORIGINAL_VERSION=$(jq -r '.version' ./package.json)
          FORK_VERSION="${ORIGINAL_VERSION}-fork.3"
          echo "computed_version=$FORK_VERSION" >> $GITHUB_OUTPUT

          jq --arg ver "$FORK_VERSION" '.version = $ver' ./@utahdts/utah-design-system/package.json > temp1.json && mv temp1.json ./@utahdts/utah-design-system/package.json
          jq --arg ver "$FORK_VERSION" '.version = $ver' ./@utahdts/utah-design-system-header/package.json > temp2.json && mv temp2.json ./@utahdts/utah-design-system-header/package.json

      # Step 3: Compile workspaces using native, unaltered monorepo pipelines
      - name: Compile Workspace Libraries
        run: npm run buildForNPM

      # Step 4: Pack the workspaces using native npm commands
      - name: Pack Workspace Libraries
        id: pack_step
        run: |
          npm pack --workspaces

          VERSION_TAG="${{ steps.version_env.outputs.computed_version }}"

          # Map the native output paths cleanly (keeping original @utahdts naming conventions)
          echo "core_path=$GITHUB_WORKSPACE/utahdts-utah-design-system-${VERSION_TAG}.tgz" >> $GITHUB_OUTPUT
          echo "header_path=$GITHUB_WORKSPACE/utahdts-utah-design-system-header-${VERSION_TAG}.tgz" >> $GITHUB_OUTPUT

      # Step 5: Upload both generated tarball assets to the single GitHub Release
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version_env.outputs.computed_version }}"
          name: "Release v${{ steps.version_env.outputs.computed_version }} (DWQ Date Range Patch)"
          draft: false
          prerelease: false
          files: |
            ${{ steps.pack_step.outputs.core_path }}
            ${{ steps.pack_step.outputs.header_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          